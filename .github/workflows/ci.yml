name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm install

      - name: Build core
        run: npm run build --workspace @storytime/core

      - name: Test core
        run: npm run test --workspace @storytime/core

      - name: Typecheck server
        run: npm run build --workspace @storytime/server

      - name: Build web
        run: npm run build --workspace @storytime/web

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t storytime:ci .
